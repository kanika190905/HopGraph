name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Lightweight: no PyTorch, no model downloads. Encoders, NER and the reranker are stubbed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas networkx pyyaml psutil bm25s PyStemmer faiss-cpu spacy pytest ruff
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Test
        run: python -m pytest -q
