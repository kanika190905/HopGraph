[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopgraph"
version = "0.1.0.dev0"
description = "LLM-free, CPU-first study of graph-enhanced multi-hop passage retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "networkx",
    "pyyaml",
    "psutil",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
# Heavy model stack. Install torch first from the CPU index:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
models = [
    "torch",
    "sentence-transformers",
    "faiss-cpu",
    "bm25s",
    "PyStemmer",
    "spacy",
]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "models: needs downloaded models (spaCy / sentence-transformers); skipped in CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
# Strict checking for stabilized pure-Python modules only.
[[tool.mypy.overrides]]
module = ["hopgraph.evaluation.*", "hopgraph.retrieval.fusion", "hopgraph.graph.ppr", "hopgraph.types", "hopgraph.config"]
disallow_untyped_defs = true
